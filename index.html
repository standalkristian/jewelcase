<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jewelcase</title>

  <!-- your fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Barriecito&family=Dokdo&family=Dr+Sugiyama&family=Freckle+Face&family=Geo:ital@0;1&family=Knewave&family=Quicksand:wght@300..700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <svg width="0" height="0" style="position:absolute">
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="1" seed="3" stitchTiles="stitch"
        result="noise" />

      <!-- boost contrast hard -->
      <feColorMatrix in="noise" type="saturate" values="0" />

      <feComponentTransfer>
        <feFuncR type="linear" slope="4" />
        <feFuncG type="linear" slope="4" />
        <feFuncB type="linear" slope="4" />
      </feComponentTransfer>
    </filter>
  </svg>



  <header class="site-header">
    <h1>
      <a href="./" class="logo-link">Jewelcase</a>
    </h1>
  </header>

  <main class="layout">
    <section class="album-grid-scroll">
      <div id="album-grid" class="album-grid"></div>
    </section>

    <aside class="filters">
      <div class="filters-header">
        <div class="filters-title">Filters</div>
        <button id="clear-filters" class="btn-clear" type="button">Clear</button>
      </div>

      <div class="filter-section">
        <div class="filter-label">Mood</div>
        <div id="filter-moods" class="filter-group"></div>
      </div>

      <div class="filter-section">
        <div class="filter-label">Genre</div>
        <div id="filter-genres" class="filter-group"></div>
      </div>

      <div class="filter-section">
        <div class="filter-label">Tags</div>
        <div id="filter-tags" class="filter-group"></div>
      </div>
    </aside>
  </main>


  <!-- Album modal -->
  <div id="album-modal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close="true"></div>

    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-content">
        <div class="modal-cover-wrap">
          <img id="modal-cover" class="modal-cover" alt="" />
        </div>

        <div class="modal-info">
          <div class="modal-header">
            <div id="modal-rating" class="modal-rating">
              <svg class="rating-shape" viewBox="0 0 100 100" aria-hidden="true">
                <polygon points="25,10 75,10 95,40 50,95 5,40" fill="currentColor" />
              </svg>
              <span class="rating-text"></span>
            </div>

            <div class="modal-heading">
              <div id="modal-subtitle" class="modal-subtitle"></div>
              <div id="modal-title" class="modal-title"></div>
            </div>
          </div>

          <div class="modal-body-part">
            <div class="section-album-info">
              <div class="section-label">Moods</div>
              <div id="modal-moods" class="mood-row"></div>
            </div>

            <div class="divider-wave-v" aria-hidden="true"></div>

            <div class="section-album-info">
              <div class="section-label">Info</div>
              <div class="modal-meta-section">
                <div class="modal-meta">
                  <div class="modal-meta-line" id="modal-meta-line">
                    <span id="modal-genre"></span>
                    <span id="modal-year"></span>
                    <span id="modal-type"></span>
                  </div>
                </div>
                <div class="modal-runtime-line"><span id="modal-runtime"></span></div>
              </div>




            </div>
          </div>
          <div class="modal-body-part">
            <div class="modal-left">






              <div class="modal-section-tracklist">
                <div class="section-label">Tracklist</div>
                <ol id="modal-tracklist" class="tracklist"></ol>
              </div>

            </div>

            <div class="divider-wave-v" aria-hidden="true"></div>


            <div class="modal-right">

              <div class="modal-section">
                <div class="section-label">Tags</div>
                <div id="modal-tags" class="pill-row"></div>
              </div>
            </div>
          </div>
        </div>
      </div><!-- /.modal-content -->
    </div><!-- /.modal-panel -->
  </div><!-- /.modal -->

  <script src="script.js"></script>
</body>

</html>
