<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jewelcase</title>

  <!-- your fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dr+Sugiyama&family=Knewave&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="site-header">
    <h1>Jewelcase</h1>
  </header>

<main class="layout">
  <section class="album-grid-scroll">
    <div id="album-grid" class="album-grid"></div>
  </section>

  <aside class="filters">
    <div class="filters-header">
      <div class="filters-title">Filters</div>
      <button id="clear-filters" class="btn-clear" type="button">Clear</button>
    </div>

    <div class="filter-section">
      <div class="filter-label">Genre</div>
      <div id="filter-genres" class="filter-group"></div>
    </div>

    <div class="filter-section">
      <div class="filter-label">Mood</div>
      <div id="filter-moods" class="filter-group"></div>
    </div>

    <div class="filter-section">
      <div class="filter-label">Tags</div>
      <div id="filter-tags" class="filter-group"></div>
    </div>
  </aside>
</main>


<!-- Album modal -->
<div id="album-modal" class="modal" aria-hidden="true">
  <div class="modal-backdrop" data-close="true"></div>

  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    

    <div class="modal-content">
      <div class="modal-cover-wrap">
        <img id="modal-cover" class="modal-cover" alt="" />
      </div>

      <div class="modal-info">
      <div class="modal-header">
        <div id="modal-rating" class="modal-rating"></div>
        <div class="modal-heading">
        <div id="modal-subtitle" class="modal-subtitle"></div>
        <div id="modal-title" class="modal-title"></div>

        </div>
      </div>
        <div class="modal-body">

        <div class="modal-left">
          <div class="modal-section">
      <div class="section-label">Runtime</div>
      <div id="modal-runtime" class="runtime-text"></div>
    </div>
        <div class="modal-meta">
          <div><span class="meta-label">Year</span> <span id="modal-year"></span></div>
          <div><span class="meta-label">Type</span> <span id="modal-type"></span></div>
          <div><span class="meta-label">Genre</span> <span id="modal-genre"></span></div>
        </div>

        <div class="modal-section">
          <div class="section-label">Mood</div>
          <div id="modal-mood" class="pill-row"></div>
        </div>

        <div class="modal-section">
          <div class="section-label">Tags</div>
          <div id="modal-tags" class="pill-row"></div>
        </div>
      </div>

  <div class="modal-right">
    

    <div class="modal-section">
      <div class="section-label">Tracklist</div>
      <ol id="modal-tracklist" class="tracklist"></ol>
    </div>
  </div>
</div>

  <script src="script.js"></script>
</body>
</html>
